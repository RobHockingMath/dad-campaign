<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="David Hocking's new website is coming soon.">
  <meta name="theme-color" content="#184251">
  <title>David Hocking — Website coming soon</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #184251; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      color: #f3f5ef;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      line-height: 1.65;
    }
    main {
      width: 100%;
      max-width: 720px;
      padding: clamp(32px, 7vw, 80px) clamp(24px, 6vw, 64px);
      border: 4px double #6fb3aa;
      background: #1d4d5e;
    }
    .name {
      margin: 0 0 24px;
      color: #bce0d8;
      font: 600 15px/1.6 system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1.15;
      font-weight: 400;
    }
    .message { margin: 0; font-size: clamp(17px, 2.5vw, 21px); }
    .address {
      margin: 40px 0 0;
      color: #bce0d8;
      font: 14px/1.6 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <p class="name">David Hocking</p>
    <h1>Website coming soon</h1>
    <p class="message">We're preparing a new website.<br>Please check back soon.</p>
    <p class="address">davidhocking.ca</p>
  </main>
</body>
</html>
